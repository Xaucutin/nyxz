# Nyxz — padrões do Hyprland. Vêm com a imagem e atualizam sozinhos.
# Não edite aqui: mude o que quiser em ~/.config/hypr/user.conf (carregado por último).

# ---------------------------------------------------------------- monitores
# Maior taxa de atualização disponível (180 Hz no Mancer Valak), posição e escala automáticas.
monitor = , highrr, auto, 1

# ---------------------------------------------------------------- variáveis
$mod = SUPER
$terminal = nyx run /usr/libexec/nyxz/terminal
$lancador = nyx run fuzzel

# ---------------------------------------------------------------- entrada
input {
    kb_layout = br
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0
}

# ---------------------------------------------------------------- aparência
# Paleta Nyxz: fundo #09090D, borda #1E1E25, borda em foco #2A2A32.
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgb(2A2A32)
    col.inactive_border = rgb(17171D)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000066)
    }
}

# ---------------------------------------------------------------- animações
# Curva exponencial no estilo Lenis: chega rápido e assenta sem rebote.
animations {
    enabled = true
    bezier = nyxz, 0.16, 1, 0.3, 1
    bezier = nyxzRapida, 0.2, 0, 0, 1

    animation = windows, 1, 4, nyxz, popin 97%
    animation = windowsOut, 1, 3, nyxzRapida, popin 98%
    animation = border, 1, 4, nyxzRapida
    animation = fade, 1, 3, nyxzRapida
    animation = workspaces, 1, 6, nyxz, slide
    animation = layers, 1, 3, nyxz, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(09090D)
    # VRR (FreeSync) só em tela cheia, para não piscar no desktop.
    vrr = 2
}

# ---------------------------------------------------------------- atalhos
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $lancador
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, E, exec, uwsm stop || hyprctl dispatch exit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mover e redimensionar com Super + arrastar (o "AltDrag" da Nyxz)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume e mídia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ---------------------------------------------------------------- inicialização
# Agente de permissões (pede senha quando um app precisa de administrador)
exec-once = systemctl --user start hyprpolkitagent
