# Nyxz: microfone sem ruído (supressão de ruído + cancelamento de eco + ganho
# automático), com o processamento WebRTC que já vem no PipeWire. Roda numa
# instância própria (nyxz-supressao.service) só enquanto estiver ligado.
# Cria a entrada "Microfone (sem ruído)", que vira o microfone padrão.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { nice.level = -11 }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-echo-cancel
      args = {
          library.name  = aec/libspa-aec-webrtc
          node.latency  = 480/48000
          monitor.mode  = true
          capture.props = {
              node.name    = "nyxz_mic_captura"
              node.passive = true
          }
          source.props = {
              node.name        = "nyxz_mic_limpo"
              node.description = "Microfone (sem ruído)"
          }
          aec.args = {
              webrtc.noise_suppression = true
              webrtc.gain_control      = true
              webrtc.extended_filter   = true
              webrtc.high_pass_filter  = true
          }
      }
    }
]
