[package]
name = "nyxz-scoped"
version = "0.1.0"
edition = "2021"
description = "Nyxz: acompanha apps (escopos do systemd), janelas e jogos e publica em org.nyxz.Apps"
license = "MIT"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Serviço residente: binário pequeno e pouca RAM (meta ~5 MB).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
